<!doctype html>
<!-- URL を貼ったときのカード画像 public/og-default.png（1200×630）の元。設計書 5.2・6章。
     作り方：ブラウザで 1200×630 の大きさで開いて画面写真を撮る（README 参照） -->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fbf7ee; color: #2b261f;
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
  }
  .left { padding-left: 80px; }
  h1 { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif; font-size: 84px; font-weight: 800; line-height: 1.2; }
  .vs { margin-top: 28px; font-size: 52px; font-weight: 800; }
  .vs .oku { color: #9b9486; }
  .vs .one { color: #b97f0e; }
  .tag { margin-top: 20px; font-size: 28px; color: #7a6d5c; }
  svg { width: 520px; height: 420px; }
</style>
</head>
<body>
  <div class="left">
    <h1>乗り換えたら<br>負け</h1>
    <p class="vs"><span class="oku">1億円</span> vs <span class="one">1円</span></p>
    <p class="tag">1円を毎日2倍・30日</p>
  </div>
  <svg viewBox="0 0 520 420" aria-hidden="true">
    <rect x="10" y="60" width="500" height="340" rx="16" fill="#fffdf8" stroke="#e4d8bf" stroke-width="2"/>
    <line x1="10" y1="140" x2="510" y2="140" stroke="#9b9486" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 398 L300 396 C 360 394, 400 380, 430 330 S 470 160, 480 20" fill="none" stroke="#b97f0e" stroke-width="10" stroke-linecap="round"/>
    <path d="M466 36 L480 14 L494 36" fill="none" stroke="#b97f0e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</body>
</html>
