<!-- URL を貼ったときのプレビュー画像 public/og-default.png（1200×630）の元。2026-11-20 オーナー決定の案 A「対決」。
     作り方：ブラウザで 1200×630 の大きさで開いて画面写真を撮る -->
<!doctype html><html lang="ja"><head><meta charset="UTF-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;color:#fff}
.l,.r{position:absolute;top:0;bottom:0;width:640px}
.l{left:0;background:linear-gradient(160deg,#1f6b4f,#0f3a2b);clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.r{right:0;background:linear-gradient(200deg,#f0b93a,#b97f0e);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.side{position:absolute;top:150px;text-align:center;width:420px}
.sl{left:40px}.sr{right:40px;color:#2b261f}
.emo{font-size:130px;line-height:1}
.big{font-size:92px;font-weight:900;line-height:1.1;margin-top:14px}
.sub{font-size:30px;font-weight:800;margin-top:6px;opacity:.9}
.vs{position:absolute;left:50%;top:250px;transform:translateX(-50%) rotate(-8deg);width:150px;height:150px;border-radius:50%;background:#fff;color:#c8323c;font-size:72px;font-weight:900;display:grid;place-items:center;box-shadow:0 8px 0 #2b261f;border:6px solid #2b261f}
.title{position:absolute;left:0;right:0;top:28px;text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:76px;font-weight:900;color:#fff;text-shadow:0 4px 0 #2b261f,0 0 20px rgba(0,0,0,.3);letter-spacing:.06em}
.q{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);white-space:nowrap;padding:8px 34px;border-radius:999px;background:#2b261f;font-size:38px;font-weight:900;color:#fff}
</style></head><body>
<div class="l"></div><div class="r"></div>
<div class="title">乗り換えたら負け</div>
<div class="side sl"><div class="emo">💴</div><div class="big">1億円</div><div class="sub">今すぐもらう</div></div>
<div class="side sr"><div class="emo">🪙</div><div class="big">1円</div><div class="sub">毎日2倍・30日</div></div>
<div class="vs">VS</div>
<div class="q">あなたは何日目に乗り換える？</div>
</body></html>
